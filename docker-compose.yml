version: '3.9'

services: 
  postgres:
    image: postgres:15
    container_name: postgres_container
    restart: always

    enviroment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD:  postgres
      POSTGRES_DB: app

    ports:
      - "5432.5432"
    volumes:
      - postgres-data:/var/lib/postgres/data
  
  nodejs:
    image: node:18
    container_name: node_container
    restart: always
    commmand: tail -f /dev/null
    ports:
      - "3000.3000"
    
    nginx:
      image: nginx:alpine
      container_name: nginx_container
      restart: always
      ports:
        - "8080:8080"
      volumes:
        - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      depends_on:
        - nodejs