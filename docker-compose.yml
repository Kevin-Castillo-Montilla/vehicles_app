version: '3.9'

services: 
  postgres:
    image: postgres:15
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  nodejs:
    image: node:18
    container_name: node_container
    restart: always
    command: tail -f /dev/null
    # Nota: Quitamos los ports de aquí para que solo Nginx responda al público

  nginx:
    image: nginx:alpine
    container_name: nginx_container
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nodejs

volumes:
  postgres-data: